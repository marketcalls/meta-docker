; MetaTrader 5 configuration applied on first boot
[Common]
NewsEnable=0
EventsEnable=0
Portable=1

[Charts]
MaxBars=1000000
PrintColor=0

[Experts]
; Live trading stays on because the bridge places orders through the
; terminal. DLL imports stay off: an expert advisor that can load a DLL
; can run arbitrary native code inside the container, and nothing the
; bridge does needs it. Turn it on only for an EA you wrote yourself.
AllowLiveTrading=1
AllowDllImport=0
Enabled=1
