[project]
name = "metasdk"
version = "1.0.0"
description = "Headless MetaTrader 5 with a REST, WebSocket and gRPC bridge for Windows, Linux and macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "metatrader5>=5.0.45",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "grpcio>=1.66",
    "protobuf>=5.26",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
]
